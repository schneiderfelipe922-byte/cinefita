*{box-sizing:border-box}body{margin:0;background:#13161B;color:#F4F1EA;font-family:Arial,sans-serif;min-height:100svh;display:grid;place-content:center;padding:24px}main{width:min(900px,calc(100vw - 48px));text-align:center}.animation-stage{width:900px;max-width:100%;aspect-ratio:2/1;display:grid;align-content:center;justify-items:center;background:#13161B;padding:40px}.animation-stage svg{width:78%;height:auto;display:block}.signature{font-size:clamp(14px,2.5vw,24px);margin:24px 0 0;color:#F4F1EA}h1{font-size:14px;font-weight:400;color:#B8BEC8;margin:0 0 16px;letter-spacing:.12em}button,a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:12px 20px;border:1px solid #78818F;border-radius:4px;background:transparent;color:#F4F1EA;font-size:14px;cursor:pointer;text-decoration:none}button:hover,a:hover{border-color:#E85B53}button:focus-visible,a:focus-visible{outline:2px solid #F4F1EA;outline-offset:4px}.controls{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.note{color:#B8BEC8;font-size:13px;line-height:1.6}button:disabled{opacity:.5;cursor:default}
@media(max-width:600px){.animation-stage{padding:16px;aspect-ratio:1.5/1}.animation-stage svg{width:100%}}

/* Rounded CRT glass and a quiet frame around the preview only. */
.animation-stage{position:relative;border:14px solid #292623;border-radius:38px;background:radial-gradient(ellipse at 50% 42%,#1C2425 0%,#131A1C 56%,#080C0D 100%);box-shadow:0 0 0 2px #51483E,0 20px 50px #0006,inset 0 0 35px #0009;overflow:hidden}
.animation-stage::after{content:"";position:absolute;inset:0;border-radius:24px;box-shadow:inset 0 0 28px 12px #0008;pointer-events:none}
@media(max-width:600px){.animation-stage{border-width:8px;border-radius:24px}.animation-stage::after{border-radius:16px}}

/* The worn TV resolves into a clean contemporary stage with no layout shift. */
.animation-stage{background:#13161B;border-color:transparent;box-shadow:none}
.animation-stage svg{position:relative;z-index:1}
.animation-stage::before{content:"";position:absolute;inset:0;border-radius:24px;background:radial-gradient(ellipse at 50% 42%,#1C2425 0%,#131A1C 56%,#080C0D 100%);opacity:0;pointer-events:none}
.animation-stage::after{opacity:0}
@media(prefers-reduced-motion:no-preference){
 .animation-stage{animation:tv-frame-restore 150ms 4500ms linear both}
 .animation-stage::before,.animation-stage::after{animation:tv-glass-restore 150ms 4500ms linear both}
}
@keyframes tv-frame-restore{from{border-color:#292623;box-shadow:0 0 0 2px #51483E,0 20px 50px #0006,inset 0 0 35px #0009}to{border-color:transparent;box-shadow:0 0 0 2px #51483E00,0 20px 50px #0000,inset 0 0 35px #0000}}
@keyframes tv-glass-restore{from{opacity:1}to{opacity:0}}

/* Wear spans the full TV glass, not only the centered logo. */
.animation-stage .cinefita-motion .crt-scratches{display:none}
.animation-stage .tv-scratches{position:absolute;inset:0;width:100%;height:100%;z-index:2;opacity:0;pointer-events:none}
@media(prefers-reduced-motion:no-preference){.animation-stage .tv-scratches{animation:wear-restore 150ms 4500ms linear both}}
[data-brand-sound]{min-width:162px}.sound-settings{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:18px;font-size:13px;color:#B8BEC8}.sound-settings input{width:140px;accent-color:#E85B53;min-height:44px}.sound-settings input:focus-visible{outline:2px solid #F4F1EA;outline-offset:4px}.sound-status{min-height:20px;margin:0;font-size:13px;color:#B8BEC8}audio{display:none}
.animation-stage.is-complete{animation:none;border-color:transparent;box-shadow:none}.animation-stage.is-complete::before,.animation-stage.is-complete::after,.animation-stage.is-complete .tv-scratches{animation:none;opacity:0}

cia de reduzir movimento mantém a logo estática.</p></main><script>
const replay=document.querySelector('#replay');const stage=document.querySelector('.animation-stage');const reduced=matchMedia('(prefers-reduced-motion: reduce)');
function completePreview(){stage.classList.add('is-complete');document.querySelector('.cinefita-motion').classList.add('is-complete');}
function sync(){if(reduced.matches)completePreview();replay.disabled=reduced.matches;replay.textContent=reduced.matches?'Movimento reduzido ativo':'Repetir animação';}reduced.addEventListener('change',sync);sync();
document.querySelector('.cinefita-motion').addEventListener('animationend',event=>{if(event.animationName==='film-glint')completePreview();});
replay.addEventListener('click',()=>{if(!reduced.matches)document.querySelectorAll('.cinefita-motion').forEach(logo=>{stage.classList.remove('is-complete');logo.classList.remove('is-complete');void logo.getBoundingClientRect();document.querySelector('.animation-stage').getAnimations({subtree:true}).forEach(animation=>{animation.currentTime=0;animation.play();});});});
document.addEventListener('visibilitychange',()=>{if(document.hidden)completePreview();});
</script><script src="brand-sound.js?v=12"></script></body></html>
